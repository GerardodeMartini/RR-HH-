{% extends "base.html" %}

{% block content %}
<div
    style="max-width: 400px; margin: 4rem auto; background: white; padding: 2rem; border-radius: 8px; border: 1px solid var(--border-color); text-align: center;">
    <h2 style="margin-bottom: 0.5rem;">Candidatos (Mi Cuenta)</h2>
    <p style="color: var(--text-muted); margin-bottom: 2rem;">Ingresa para ver tus postulaciones</p>

    <form method="POST">
        {% csrf_token %}
        <div class="form-group" style="text-align: left;">
            <label>Usuario</label>
            <input type="text" name="username" required class="form-control" style="width: 100%;">
        </div>
        <div class="form-group" style="text-align: left;">
            <label>Contraseña</label>
            <div style="position: relative;">
                <input type="password" name="password" id="id_password" required style="width: 100%; padding-right: 2.5rem; box-sizing: border-box;">
                <button type="button" onclick="togglePasswordVisibility('id_password', this)" tabindex="-1" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #6b7280; cursor: pointer; padding: 0;">
                    <i class="fa-regular fa-eye"></i>
                </button>
            </div>
        </div>
        <!-- Cloudflare Turnstile -->
        <div style="margin: 1.5rem 0; display: flex; justify-content: center;">
            <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
            <div class="cf-turnstile" data-sitekey="{{ TURNSTILE_SITE_KEY }}" data-theme="light"></div>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%;">Ingresar</button>
    </form>

    <div style="margin-top: 1.5rem; display: flex; flex-direction: column; gap: 0.5rem; font-size: 0.9rem;">
        <p style="margin: 0;"><span style="color: var(--text-muted);">¿Olvidaste tu contraseña? </span><a href="{% url 'password_reset' %}" style="color: var(--accent-color); text-decoration: none; font-weight: 600;">Presiona aquí</a></p>
        <p style="margin: 0; color: var(--text-muted);">¿No tienes cuenta? <a href="{% url 'candidate_register' %}" style="color: var(--accent-color); font-weight: 600;">Regístrate aquí</a></p>
    </div>
</div>
{% endblock %}
