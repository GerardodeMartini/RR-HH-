{% extends "base.html" %}

{% block content %}
<div
    style="max-width: 400px; margin: 4rem auto; background: white; padding: 2rem; border-radius: 8px; border: 1px solid var(--border-color); text-align: center;">
    <h2 style="margin-bottom: 0.5rem;">Candidatos (Mi Cuenta)</h2>
    <p style="color: var(--text-muted); margin-bottom: 2rem;">Ingresa para ver tus postulaciones</p>

    <form method="POST">
        {% csrf_token %}
        <div class="form-group" style="text-align: left;">
            <label>Usuario</label>
            <input type="text" name="username" required class="form-control" style="width: 100%;">
        </div>
        <div class="form-group" style="text-align: left;">
            <label>Contraseña</label>
            <input type="password" name="password" required style="width: 100%;">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">Ingresar</button>
    </form>

    <div style="margin-top: 1.5rem;">
        <p>¿No tienes cuenta? <a href="{% url 'candidate_register' %}" style="color: var(--accent-color);">Regístrate
                aquí</a></p>
    </div>
</div>
{% endblock %}
