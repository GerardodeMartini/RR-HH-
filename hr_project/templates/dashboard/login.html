{% extends "base.html" %}

{% block content %}
<div
    style="max-width: 400px; margin: 4rem auto; background: white; padding: 2rem; border-radius: 8px; border: 1px solid var(--border-color); text-align: center;">
    <h2 style="margin-bottom: 0.5rem;">Acceso Reclutadores</h2>
    <p style="color: var(--text-muted); margin-bottom: 2rem;">Ingresa al Panel de Talento</p>

    <form method="POST">
        {% csrf_token %}
        <div class="form-group" style="text-align: left;">
            <label>Usuario</label>
            <input type="text" name="username" required>
        </div>
        <div class="form-group" style="text-align: left;">
            <label>Contraseña</label>
            <input type="password" name="password" required>
        </div>

        <!-- Cloudflare Turnstile -->
        <div style="margin: 1.5rem 0; display: flex; justify-content: center;">
            <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
            <div class="cf-turnstile" data-sitekey="{{ TURNSTILE_SITE_KEY }}" data-theme="light"></div>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%;">Ingresar</button>
    </form>
</div>
{% endblock %}
